<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles/form_styles.css">

    <!-- Fuente Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

    <!-- Icono de pestaña -->
    <link rel="icon" type="image/png" href="../assets/img/logo_cca_rbg2.png">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Login</title>
</head>
<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">

                <img src="../assets/img/logo_cca_rbg2.png" alt="Centro Educativo Ángel">

                <h1>Bienvenido</h1>

                <p>Centro Educativo Ángel</p>

            </div>

            <form class="login-form">

                <h2>Iniciar sesión</h2>

                <p class="login-description">
                    Ingresa tus datos para continuar
                </p>

                <div class="input-group">

                    <label for="correo">Correo electrónico</label>

                    <div class="input-box">
                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="correo"
                            placeholder="ejemplo@correo.com"
                            required
                        >
                    </div>

                </div>

                <div class="input-group">

                    <label for="password">Contraseña</label>

                    <div class="input-box">
                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                        <i class="bi bi-eye toggle-password"></i>
                    </div>

                </div>

                <a href="#" class="forgot-password">
                    ¿Olvidaste tu contraseña?
                </a>

                <button type="submit" class="login-button">
                    Iniciar sesión
                </button>

                <button
                    type="button"
                    class="cancel-button"
                    onclick="window.location.href='../index.html'">
                    Cancelar
                </button>
                
                <p class="register-text">
                    ¿No tienes cuenta?
                    <a href="./register.html">Regístrate</a>
                </p>

            </form>

        </section>

        <footer class="login-footer">
            © 2026 Centro Educativo Ángel. <br>
            Mujeres por la libertad & Bienestar para Todos, A.C.
        </footer>

    </main>

</body>
</html>
