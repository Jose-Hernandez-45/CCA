
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles/form_styles.css">

    <!-- Fuente Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

    <!-- Icono de pestaña -->
    <link rel="icon" type="image/png" href="../assets/img/logo_cca_rbg2.png">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Registro</title>
</head>

<body>

    <main class="login-container">

        <section class="login-card register-card">

            <div class="login-header">

                <img src="../assets/img/logo_cca_rbg2.png" alt="Centro Educativo Ángel">

                <h1>¡Únete a nosotros!</h1>

                <p>Centro Educativo Ángel</p>

            </div>

            <form class="login-form">

                <h2>Crear cuenta</h2>

                <p class="login-description">
                    Completa tus datos para registrarte
                </p>

                <!-- NOMBRE -->
                <div class="input-group">

                    <label for="nombre">Nombre completo</label>

                    <div class="input-box">
                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Ingresa tu nombre"
                            required
                        >
                    </div>

                </div>

                <!-- CORREO -->
                <div class="input-group">

                    <label for="correo">Correo electrónico</label>

                    <div class="input-box">
                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="correo"
                            placeholder="ejemplo@correo.com"
                            required
                        >
                    </div>

                </div>

                <!-- CONTRASEÑA -->
                <div class="input-group">

                    <label for="password">Contraseña</label>

                    <div class="input-box">
                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Crea una contraseña"
                            required
                        >
                    </div>

                </div>

                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="input-group">

                    <label for="confirm-password">Confirmar contraseña</label>

                    <div class="input-box">
                        <i class="bi bi-shield-lock"></i>

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirma tu contraseña"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="login-button">
                    Crear cuenta
                </button>

                <button
                    type="button"
                    class="cancel-button"
                    onclick="window.location.href='../index.html'">
                    Cancelar
                </button>

                <p class="register-text">
                    ¿Ya tienes una cuenta?
                    <a href="login.html">Inicia sesión</a>
                </p>

            </form>

        </section>

        <footer class="login-footer">
            © 2026 Centro Educativo Ángel. <br>
            Mujeres por la libertad & Bienestar para Todos, A.C.
        </footer>

    </main>

</body>
</html>
